name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore signing keystore
        env:
          TFF_KEYSTORE_B64: ${{ secrets.TFF_KEYSTORE_B64 }}
          TFF_STORE_PASSWORD: ${{ secrets.TFF_STORE_PASSWORD }}
          TFF_KEY_PASSWORD: ${{ secrets.TFF_KEY_PASSWORD }}
        run: |
          echo "$TFF_KEYSTORE_B64" | base64 -d > release.keystore
          ls -la release.keystore
          sha256sum release.keystore
          keytool -list -keystore release.keystore -storepass "$TFF_STORE_PASSWORD" -alias tff -keypass "$TFF_KEY_PASSWORD" | head -6
          echo "TFF_STORE_PASSWORD=$TFF_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TFF_KEY_PASSWORD=$TFF_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: tff-qq-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            app/build/outputs/**/*.txt
            app/build/reports/**/*
